<button id="back-to-top" type="button" title="返回顶部" aria-label="返回顶部">↑</button>
<script>
(function () {
  var btn = document.getElementById('back-to-top');
  if (!btn) return;
  var onScroll = function () {
    if (window.scrollY > 400) btn.classList.add('show');
    else btn.classList.remove('show');
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  btn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
<script>
(function () {
  var meta = document.getElementById('meta-theme-color');
  if (!meta) return;
  // 地址栏主题色直接读 tokens.css 的 --page-bg 计算值（明暗与色板切换后自动重取），
  // 避免与令牌双写漂移；取不到时按当前色板的纸色兜底。
  // favicon 也在这里再同步一次：file:// 下 Quarto 不写 localStorage，只能靠 body class 变化触发。
  var sync = function () {
    var v = window.getComputedStyle(document.body).getPropertyValue('--page-bg').trim();
    var solarized = document.documentElement.getAttribute('data-palette') === 'solarized';
    var dark = document.body.classList.contains('quarto-dark');
    if (!v) {
      if (solarized) v = dark ? '#002B36' : '#FDF6E3';
      else v = dark ? '#100F0F' : '#FFFCF0';
    }
    meta.setAttribute('content', v);
    if (window.__bookSyncFavicon) window.__bookSyncFavicon();
  };
  sync();
  if (window.MutationObserver) {
    var observer = new MutationObserver(sync);
    observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-palette'] });
  }
})();
</script>
<script>
(function () {
  // Quarto 只本地化搜索结果面板文案，导航栏搜索按钮与仓库图标仍带组件库的英文默认值。
  // 这里按 zh 语言包的同义中文补齐，只在命中英文原文时替换，Quarto 自行本地化后本脚本自动失效。
  var LABELS = { 'Search': '搜索', 'Source Code': '查看代码' };
  var ATTRS = ['title', 'aria-label', 'placeholder'];
  var sync = function () {
    document
      .querySelectorAll('a.quarto-navigation-tool, #quarto-search, #quarto-search *')
      .forEach(function (el) {
        ATTRS.forEach(function (attr) {
          var text = el.getAttribute(attr);
          if (text && LABELS[text]) {
            el.setAttribute(attr, LABELS[text]);
          }
        });
      });
  };
  sync();
  window.addEventListener('load', sync);
  var box = document.getElementById('quarto-search');
  if (box && window.MutationObserver) {
    new MutationObserver(sync).observe(box, { childList: true, subtree: true });
  }
})();
</script>
