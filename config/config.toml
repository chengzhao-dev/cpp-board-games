#===--------------------------------------------------------------------------------------------===#
# config.toml - 本机工具路径与版本
#===--------------------------------------------------------------------------------------------===#

# Python 解释器：本机路径，最低 3.12。路径写成正斜杠，避免 TOML 转义。
# 失败行为：字段留空或缺失时脚本立即失败。脚本不回退 PATH。
python = "D:/ProgramData/miniforge3/python.exe"

# Python 依赖：这些包是 Quarto {python} 可执行单元的运行时依赖。CI 与本地统一读取本清单。
quarto_python_packages = [
  "jupyter>=1.0",
  "nbclient>=0.10",
  "ipykernel>=6.29",
]

# Quarto 版本：渲染用这个版本。CI 与本地渲染取同一版本。
quarto_version = "1.10.18"
