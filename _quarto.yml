project:
  type: book
  output-dir: _book

# freeze: auto 将计算结果写入根 _freeze/：它随 main 分支提交，供全项目渲染复用。
# .quarto/_freeze/ 只是本地隐藏缓存；_book/ 是忽略的静态发布输出，CI 仅发布后者。
execute:
  freeze: auto

book:
  title: "C++ 棋盘游戏实践"
  description: "用一局可下完的终端井字棋学习 C++ 工程和测试。"
  site-url: "https://chengzhao-dev.github.io/cpp-board-games"
  repo-url: "https://github.com/chengzhao-dev/cpp-board-games"
  # 读者侧只留「查看源码」入口：不提供编辑此页与议题按钮（定案见 bg-publish-surface-v1）。
  repo-actions: [source]
  favicon: ".agents/skills/designing-theme/assets/theme/assets/favicon.svg"
  page-navigation: true
  sidebar:
    collapse-level: 1
  navbar:
    title: "C++ 棋盘游戏实践"
    search: true
  chapters:
    - index.qmd
    - part: content/tictactoe/index.qmd
      chapters:
        - content/tictactoe/01-rules.qmd
        - content/tictactoe/02-project-layout.qmd
        - content/tictactoe/03-board.qmd
        - content/tictactoe/04-game.qmd
        - content/tictactoe/05-terminal-play.qmd
        - content/tictactoe/06-opponent.qmd
        - content/tictactoe/07-line-protocol.qmd

filters:
  - .agents/skills/writing-quarto/scripts/answer-disclosure.lua

format:
  html:
    theme:
      light: [cosmo, .agents/skills/designing-theme/assets/theme/palettes/github/theme-light.scss]
      dark: [darkly, .agents/skills/designing-theme/assets/theme/palettes/github/theme-dark.scss]
    grid:
      sidebar-width: 300px
      # 对齐主流文档站口径：Quarto 默认 body 800px；Quarto 会从 body-width 中再减去
      # 两侧各 1rem 的栅格内边距，正文内容列 = body-width - 32px。要完整显示 100 列
      # 代码（16px Bright Code 下 100×8 + 内边距 32 + 边框 2 = 834px 内容宽），
      # body-width 取 872px，内容列 840px、代码文本区 806px，留 6px 余量。
      # 宽视口只增大外侧留白，不按显示器拉满；窄视口由 Quarto 按断点响应缩放。
      body-width: 872px
      margin-width: 272px
      gutter-width: 1rem
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    toc-location: right
    anchor-sections: true
    code-copy: true
    # 代码不自动折行：超长行在代码块内部横向滚动（配合 code.css 的 white-space: pre），
    # wrap 会让 Quarto 注入 pre-wrap 盖掉这条规则；打印时由 code.css 恢复折行。
    code-overflow: scroll
    highlight-style:
      # 与 palettes/github/meta.md 同步；语法色来自色板目录里的两份 .theme
      # （Primer Light / Dark Dimmed），CSS 不覆盖 token。
      light: .agents/skills/designing-theme/assets/theme/palettes/github/highlight-light.theme
      dark: .agents/skills/designing-theme/assets/theme/palettes/github/highlight-dark.theme
    css:
      - .agents/skills/designing-theme/assets/theme/css/fonts.css
      - .agents/skills/designing-theme/assets/theme/css/tokens.css
      - .agents/skills/designing-theme/assets/theme/palettes/github/tokens.css
      - .agents/skills/designing-theme/assets/theme/css/base.css
      - .agents/skills/designing-theme/assets/theme/css/code.css
      - .agents/skills/designing-theme/assets/theme/css/content.css
      - .agents/skills/designing-theme/assets/theme/css/mermaid.css
      - .agents/skills/designing-theme/assets/theme/css/nav.css
      - .agents/skills/designing-theme/assets/theme/css/sidebar.css
      - .agents/skills/designing-theme/assets/theme/css/callouts.css
      - .agents/skills/designing-theme/assets/theme/css/landing.css
    include-in-header:
      - .agents/skills/designing-theme/assets/theme/includes/fonts.html
    include-after-body:
      - .agents/skills/designing-theme/assets/theme/includes/footer.html
    open-graph: true
    twitter-card: true
    number-sections: false
    lang: zh

resources:
  - .agents/skills/designing-theme/assets/theme/assets

language:
  callout-note-title: "注意"
  callout-tip-title: "提示"
  callout-important-title: "重要"
  callout-warning-title: "警告"
  callout-caution-title: "危险"
