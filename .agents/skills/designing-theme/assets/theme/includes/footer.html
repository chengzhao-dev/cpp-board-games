<button id="back-to-top" type="button" title="返回顶部" aria-label="返回顶部">↑</button>
<script>
(function () {
  var btn = document.getElementById('back-to-top');
  if (!btn) return;
  var onScroll = function () {
    if (window.scrollY > 400) btn.classList.add('show');
    else btn.classList.remove('show');
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  btn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
<script>
(function () {
  var meta = document.getElementById('meta-theme-color');
  if (!meta) return;
  // 地址栏主题色直接读 tokens.css 的 --page-bg 计算值（body.quarto-dark 切换后自动取暗色），
  // 避免与令牌双写漂移；取不到时按当前明暗兜底
  var sync = function () {
    var v = window.getComputedStyle(document.body).getPropertyValue('--page-bg').trim();
    if (!v) v = document.body.classList.contains('quarto-dark') ? '#22272E' : '#FFFFFF';
    meta.setAttribute('content', v);
  };
  sync();
  if (window.MutationObserver) {
    new MutationObserver(sync).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  }
})();
</script>
<script>
(function () {
  // Quarto 只本地化搜索结果面板文案，导航栏搜索按钮与仓库图标仍带组件库的英文默认值。
  // 这里按 zh 语言包的同义中文补齐，只在命中英文原文时替换，Quarto 自行本地化后本脚本自动失效。
  var LABELS = { 'Search': '搜索', 'Source Code': '查看代码' };
  var ATTRS = ['title', 'aria-label', 'placeholder'];
  var sync = function () {
    document
      .querySelectorAll('a.quarto-navigation-tool, #quarto-search, #quarto-search *')
      .forEach(function (el) {
        ATTRS.forEach(function (attr) {
          var text = el.getAttribute(attr);
          if (text && LABELS[text]) {
            el.setAttribute(attr, LABELS[text]);
          }
        });
      });
  };
  sync();
  window.addEventListener('load', sync);
  var box = document.getElementById('quarto-search');
  if (box && window.MutationObserver) {
    new MutationObserver(sync).observe(box, { childList: true, subtree: true });
  }
})();
</script>
