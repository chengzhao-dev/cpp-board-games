#===--------------------------------------------------------------------------------------------===#
# config.toml - 本机工具路径与版本
#===--------------------------------------------------------------------------------------------===#

# 本机 Python 解释器（最低 3.12）的完整路径；写成正斜杠避免 TOML 转义。
# 留空或缺失时脚本立即失败，不回退 PATH。
python = "D:/ProgramData/miniforge3/python.exe"

# Quarto {python} 可执行单元的运行时依赖，CI 与本地统一读取。
quarto_python_packages = [
  "jupyter>=1.0",
  "nbclient>=0.10",
  "ipykernel>=6.29",
]

# 渲染所用 Quarto 版本，CI 与本地渲染取同一版本。
quarto_version = "1.10.18"
