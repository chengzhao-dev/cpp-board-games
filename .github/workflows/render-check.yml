name: "render check"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 只跑最新一次：新提交取消旧跑，省 runner 时间
concurrency:
  group: render-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-prepare
      # agents 域与 qmd 侧检查（渲染产物尚未生成，文档检查自动跳过渲染节）
      - run: /usr/bin/python3 .agents/skills/governing-agents/scripts/run.py check --profile fast
      - run: /usr/bin/python3 .agents/skills/governing-agents/scripts/run.py render
      - run: /usr/bin/python3 .agents/skills/governing-agents/scripts/run.py check --profile full
