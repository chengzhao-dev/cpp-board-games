name: "render check"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # config.toml 的 python 字段是仓库唯一解释器来源；CI 把它指到 runner 的 python3
      - name: Point config.toml python at the runner interpreter
        run: sed -i 's|^python = .*|python = "/usr/bin/python3"|' config.toml
      # agents 域与 qmd 侧检查（渲染产物尚未生成，文档检查自动跳过渲染节）
      - run: python3 .agents/skills/governing-agents/scripts/run.py check --profile fast
      # 渲染以暴露结构性错误（缺文件/引用失效等）
      - run: quarto render
      # 全量校验：qmd 规则 + 渲染产物抽查
      - run: python3 .agents/skills/governing-agents/scripts/run.py check --profile full
