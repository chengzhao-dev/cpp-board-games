name: "quarto build & deploy"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# 同一时刻只允许一个部署任务，后来者排队（不取消进行中的发布，避免 gh-pages 半更新）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: config.toml
      # config.toml 的 python 字段是仓库唯一解释器来源；CI 把它指到 runner 的 python3。
      - name: Point config.toml python at the runner interpreter
        run: sed -i 's|^python = .*|python = "/usr/bin/python3"|' config.toml
      # {python} 可执行单元（坐标图）依赖由 config.toml 声明，统一入口安装。
      - name: Install Quarto executable-cell dependencies
        run: /usr/bin/python3 .agents/skills/governing-agents/scripts/run.py install-quarto-deps
      # 渲染前先跑编码与文档规则：content/ 的乱码在这里被硬性拦下，而不是发到线上
      - name: Pre-render checks
        run: /usr/bin/python3 .agents/skills/governing-agents/scripts/run.py check --profile fast
      - name: Render book
        run: /usr/bin/python3 .agents/skills/governing-agents/scripts/run.py render
      - name: Post-render checks
        run: /usr/bin/python3 .agents/skills/governing-agents/scripts/run.py check --profile full
      - name: Publish _book to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          # 每次部署用孤立分支覆盖 gh-pages：产物是生成物，不累积历史
          force_orphan: true
      # 幂等纠正 Pages 源分支：POST 首次创建、PUT 纠正（成功返回 204）。
      # GITHUB_TOKEN 可能无权创建/修改（403 Resource not accessible by integration），
      # 所以最终以读回的 GET 结果判定，源不是 gh-pages /(root) 就让 job 失败
      - name: Verify Pages source = gh-pages /(root)
        run: |
          api=https://api.github.com/repos/${{ github.repository }}/pages
          auth="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          accept="Accept: application/vnd.github+json"
          code=$(curl -s -o /tmp/pages_create.json -w "%{http_code}" -X POST -H "$auth" -H "$accept" "$api" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "POST /pages (create) -> HTTP $code: $(cat /tmp/pages_create.json)"
          code=$(curl -s -o /tmp/pages_update.json -w "%{http_code}" -X PUT -H "$auth" -H "$accept" "$api" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "PUT /pages (source correction) -> HTTP $code: $(cat /tmp/pages_update.json)"
          get=$(curl -s -o /tmp/pages_get.json -w "%{http_code}" -H "$auth" -H "$accept" "$api")
          branch=$(python3 -c "import json; print(json.load(open('/tmp/pages_get.json')).get('source', {}).get('branch', ''))")
          path=$(python3 -c "import json; print(json.load(open('/tmp/pages_get.json')).get('source', {}).get('path', ''))")
          echo "GET /pages -> HTTP $get, source = $branch $path"
          if [ "$get" != "200" ] || [ "$branch" != "gh-pages" ] || [ "$path" != "/" ]; then
            echo "ERROR: Pages 源不是 gh-pages /(root)（HTTP $get）。"
            echo "POST/PUT 返回 403 表示 GITHUB_TOKEN 无权创建或修改，需一次性用 PAT 或在 Settings -> Pages 手动设置。"
            exit 1
          fi
