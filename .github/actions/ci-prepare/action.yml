name: "CI prepare"
description: 派生 pip 缓存键与 Quarto 版本，安装 Quarto、Python 与可执行单元依赖

# 检出必须留在调用方：复合动作的文件本身要先检出才存在。
runs:
  using: composite
  steps:
    # pip 缓存键与 Quarto 版本都从 config.toml 派生：缓存只随依赖清单变化，
    # 不随本机 python 路径等无关字段变化
    - id: cfg
      name: Derive CI inputs from config.toml
      shell: bash
      run: |
        sed -n '/^quarto_python_packages/,/^]/p' config.toml | grep -o '"[^"]*"' > quarto-requirements.txt
        cat quarto-requirements.txt
        echo "quarto=$(sed -n 's/^quarto_version *= *"\([^"]*\)".*/\1/p' config.toml)" >> "$GITHUB_OUTPUT"
    - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
      with:
        version: ${{ steps.cfg.outputs.quarto }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: quarto-requirements.txt
    # config.toml 的 python 字段是仓库唯一解释器来源；CI 把它指到 runner 的 python3。
    - name: Point config.toml python at the runner interpreter
      shell: bash
      run: sed -i 's|^python = .*|python = "/usr/bin/python3"|' config.toml
    # {python} 可执行单元（坐标图）依赖由 config.toml 声明，统一入口安装。
    - name: Install Quarto executable-cell dependencies
      shell: bash
      run: /usr/bin/python3 .agents/skills/governing-agents/scripts/run.py install-quarto-deps
