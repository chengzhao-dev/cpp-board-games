name: "CI prepare"
description: 派生 pip 缓存键与 Quarto 版本，安装 Quarto、Python 与可执行单元依赖

# 检出必须留在调用方。复合动作的文件只有先检出才存在。
runs:
  using: composite
  steps:
    # 井字棋工程用 -stdlib=libc++ 编译。runner 自带 clang，但默认只有 libstdc++ 头文件；
    # 缺少 libc++ 时 clang 会在每个源文件上报 'cstdint' file not found。先补依赖再编译。
    - name: Install libc++ for the C++ builds
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libc++-dev libc++abi-dev
    # 缓存键：pip 缓存键与 Quarto 版本都从 config/config.toml 派生。
    # 缓存只随依赖清单变化。本机 python 路径等无关字段的变化不进缓存键。
    - id: cfg
      name: Derive CI inputs from config/config.toml
      shell: bash
      run: |
        # 缓存文件：依赖清单只作为缓存键。清单写到已忽略的 temp/。仓库根受 Agent 控制检查白名单的约束。
        mkdir -p temp
        sed -n '/^quarto_python_packages/,/^]/p' config/config.toml | grep -o '"[^"]*"' | tr -d '"' > temp/quarto-requirements.txt
        if grep -q '"' temp/quarto-requirements.txt; then
          echo "ERROR: temp/quarto-requirements.txt 不应包含 TOML 引号" >&2
          exit 1
        fi
        cat temp/quarto-requirements.txt
        echo "quarto=$(sed -n 's/^quarto_version *= *"\([^"]*\)".*/\1/p' config/config.toml)" >> "$GITHUB_OUTPUT"
    - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
      with:
        version: ${{ steps.cfg.outputs.quarto }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: temp/quarto-requirements.txt
    # 解释器来源：config/config.toml 的 python 字段是仓库唯一来源；CI 把它指到 runner 的 python3。
    - name: Point config/config.toml python at the runner interpreter
      shell: bash
      run: sed -i 's|^python = .*|python = "/usr/bin/python3"|' config/config.toml
    # 依赖声明：{python} 可执行单元（坐标图）的依赖由 config/config.toml 声明。
    - name: Install Quarto executable-cell dependencies
      shell: bash
      run: /usr/bin/python3 -m pip install -r temp/quarto-requirements.txt
    # 内容检查器来自插件仓库的固定提交。直接取脚本，避免 CI 依赖 npm 上过期版本。
    - name: Install content checker
      shell: bash
      run: |
        mkdir -p temp/checker
        curl -fsSL "https://raw.githubusercontent.com/chengzhao-dev/dsh-quarto-book/c425d68493e2603e1efe250a55e1c8d93ce50fc7/skills/writing-quarto/scripts/verifying-content.py" -o temp/checker/verifying-content.py
        /usr/bin/python3 -m py_compile temp/checker/verifying-content.py
        echo "BOARD_GAMES_CONTENT_CHECKER=$GITHUB_WORKSPACE/temp/checker/verifying-content.py" >> "$GITHUB_ENV"
